# =============================================================
# LedgerFlow Test Configuration
# =============================================================
# Uses H2 in-memory database so tests run without Docker/PostgreSQL.

spring:
  datasource:
    url: jdbc:h2:mem:ledgerflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: WARN
    com.ledgerflow: INFO
