# =============================================================
# LedgerFlow Test Configuration
# =============================================================
# Uses H2 in-memory database so tests run without Docker/PostgreSQL.
# Excludes MongoDB so tests run without live Mongo daemon.

spring:
  datasource:
    url: jdbc:h2:mem:ledgerflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable MongoDB in automated test profile for isolation
  data:
    mongodb:
      repositories:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

logging:
  level:
    root: WARN
    com.ledgerflow: INFO
