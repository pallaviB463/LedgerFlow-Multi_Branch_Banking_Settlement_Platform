# =============================================================
# LedgerFlow Application Configuration
# =============================================================

server:
  port: 8080

spring:
  application:
    name: LedgerFlow

  # ----- Database 1: Relational Paradigm (PostgreSQL) -----
  datasource:
    url: jdbc:postgresql://localhost:5433/ledgerflow
    username: ledgerflow
    password: ledgerflow123
    driver-class-name: org.postgresql.Driver

  # ----- JPA / Hibernate -----
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ----- Database 2: NoSQL Document Paradigm (MongoDB) -----
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ledgerflow_audit}
      auto-index-creation: true

# ----- Logging -----
logging:
  level:
    root: INFO
    com.ledgerflow: DEBUG
