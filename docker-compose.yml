services:
  # PostgreSQL database for LedgerFlow (Relational Paradigm: Core Ledger & ACID Transfers)
  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_DB: ledgerflow           # Database name
      POSTGRES_USER: ledgerflow         # Username
      POSTGRES_PASSWORD: ledgerflow123  # Password (local dev only)
    ports:
      - "5433:5432"                     # Maps container port 5432 to host port 5433
    volumes:
      - pgdata:/var/lib/postgresql/data # Persists data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB NoSQL database for LedgerFlow (Document Paradigm: Compliance Audit Logs & Settlement Receipts)
  mongodb:
    image: mongo:7.0
    container_name: ledgerflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"                   # Standard MongoDB port
    environment:
      MONGO_INITDB_DATABASE: ledgerflow_audit
    volumes:
      - mongodata:/data/db

# Named volumes for persistent database storage
volumes:
  pgdata:
  mongodata:
